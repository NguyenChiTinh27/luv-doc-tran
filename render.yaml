services:
  - type: web
    name: luv-doc-tran
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TITAN_LICENSE_VERIFY_URL
        value: "https://messages-aka-solo-lauderdale.trycloudflare.com/api/license/verify"
