services:
  - type: web
    name: luv-doc-tran
    env: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TITAN_LICENSE_VERIFY_URL
        value: "https://messages-aka-solo-lauderdale.trycloudflare.com/api/license/verify"
